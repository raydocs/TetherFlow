name: Steam accelerator verification
on:
  push:
    branches: ['wip/steam-ios-dual-download']
    paths:
      - 'desktop/internal/**'
      - 'desktop/cmd/steam-accelerator/**'
      - 'desktop/steam-tools/**'
      - 'ios/**'
      - 'integration/**'
      - 'desktop/integration/**'
      - '.github/workflows/steam-accelerator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Windows protocol, scheduling, hosts and launcher tests
        working-directory: desktop
        run: |
          go test -race -count=3 ./internal/steamaccel ./internal/steamsetup ./internal/usbmux ./cmd/steam-accelerator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./internal/steamaccel ./internal/steamsetup ./internal/usbmux ./cmd/steam-accelerator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o steam-tools/tetherflow-steam-accelerator.exe ./cmd/steam-accelerator
          exit $LASTEXITCODE
      - name: Parse PowerShell launcher and run read-only diagnostics
        shell: pwsh
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/desktop/steam-tools/Start-SteamAccelerator.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          & ./desktop/steam-tools/tetherflow-steam-accelerator.exe --doctor
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: tetherflow-steam-windows-experimental
          path: |
            desktop/steam-tools/tetherflow-steam-accelerator.exe
            desktop/steam-tools/Start-SteamAccelerator.ps1
            desktop/steam-tools/README.zh-CN.md
          retention-days: 7
  mac-host:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: macOS host protocol tests (not physical iOS)
        run: |
          swift test --package-path ios
          python3 -m unittest discover -s ios/tools -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Cross-language Go to production Swift transport tests (host only)
        run: TF_INTEGRATION_COUNT=10 ./integration/verify-host.sh
      - name: Unsigned generic iOS device build (not simulator or signed install)
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ios/tools/build-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetherflow-ios-unsigned-build-evidence
          path: ios/logs/xcode*.log
          retention-days: 7
